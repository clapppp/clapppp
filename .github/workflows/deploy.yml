name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clapppp/package-lock.json

      - name: Install Dependencies
        working-directory: clapppp
        run: npm ci

      - name: Build Next App
        working-directory: clapppp
        run: npm run build

      - name: Pack Runtime Files
        run: |
          cd clapppp
          bash scripts/assemble-deploy.sh
          tar -czf ../deploy.tar.gz -C deploy .

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu/"

      - name: Restart Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e

            rm -rf /home/ubuntu/clapppp
            mkdir /home/ubuntu/clapppp

            tar -xzf /home/ubuntu/deploy.tar.gz -C /home/ubuntu/clapppp
            rm -f /home/ubuntu/deploy.tar.gz

            sudo systemctl restart clapppp

            echo "Deploy Success!"
